site_name: Исследовательская wiki
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand

nav:
  - Начало: README.md
  - Wiki GitMark:
      - Состояние и задачи: gitmark/README.md
      - Онтология: gitmark/ontology.md
  - Исследование:
      - Короткий обзор: gitmark/research-overview.md
      - Научные источники: gitmark/sources.md
  - Подробные материалы:
      - Постановка и протокол: gitmark/research.md
      - Архитектура v0.2: gitmark/architecture.md
      - Протокол HotpotQA: gitmark/hotpotqa-protocol.md
      - Модели: gitmark/model-research.md
      - Стенд τ-bench: gitmark/tau-bench-review.md
  - Работа над ВКР:
      - Совместная работа: gitmark/team.md
      - Требования ВКР: gitmark/vkr.md
      - Документы агентов: gitmark/agents/README.md
      - Процесс для агентов: gitmark/agents/workflow.md
      - Доменный контекст: gitmark/agents/domain.md
      - Задачи проекта: gitmark/agents/issue-tracker.md
      - Статусы триажа: gitmark/agents/triage-labels.md

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - meta
  - tables
  - pymdownx.tasklist
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn
